{% extends "base.html" %}
{% block title %}Games{% endblock %}
{% block content %}

<div class="box">
    <h2>Games</h2>
    <table>
        <tr><th>Game</th><th>Description</th></tr>
        {% for game in games %}
        <tr>
            <td><a href="{{ game.url }}">{{ game.name }}</a></td>
            <td>{{ game.description }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
