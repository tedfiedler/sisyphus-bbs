[project]
name = "sisyphus-bbs"
version = "1.0.0"
description = "A modern web BBS"
requires-python = ">=3.12"
# Minimum versions the code is known to work with. Several floors are there
# for security rather than features: starlette and python-multipart have had
# request-parsing denial-of-service fixes, jinja2 a sandbox escape.
# requirements.txt pins the exact versions that were tested; keep the two
# lists naming the same packages (tests/test_packaging.py checks).
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.47.2",
    "uvicorn>=0.30",
    "websockets>=13",
    "anyio>=4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
